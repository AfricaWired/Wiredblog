# AfricaWired — Jekyll configuration

title: "AfricaWired"
tagline: "Software Engineering, Cloud & Cybersecurity"
description: >-
  AfricaWired is a software engineering company based in Sakina, Arusha, Tanzania —
  building web, mobile, cloud, AI and cybersecurity solutions for businesses across Africa.

email: thisguyhack@gmail.com
url: "https://africawired.co.tz"
baseurl: ""

company:
  name: AfricaWired
  address_line: "Sakina, Arusha"
  country: "Tanzania"
  email: thisguyhack@gmail.com
  website: "https://africawired.co.tz"

# Pagination (jekyll-paginate v1 — the template page must live in the same
# directory as paginate_path's parent, hence blog/index.html + /blog/page:num/)
paginate: 6
paginate_path: "/blog/page:num/"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
highlighter: rouge

permalink: /blog/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag

feed:
  path: blog/feed.xml

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
