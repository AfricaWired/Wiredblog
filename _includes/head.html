<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{{ page.excerpt | strip_html | strip_newlines | truncate: 200 | default: site.description }}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page.excerpt | strip_html | strip_newlines | truncate: 200 | default: site.description }}">
<meta name="twitter:card" content="summary_large_image">

<link rel="alternate" type="application/rss+xml" title="{{ site.title }} Blog" href="{{ '/blog/feed.xml' | relative_url }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23ff6a3d'/%3E%3Ctext x='32' y='42' font-size='26' font-family='Arial, sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EAW%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" id="theme-light-css">
<link rel="stylesheet" href="{{ '/assets/css/main-dark.css' | relative_url }}" id="theme-dark-css" disabled>
<noscript><link rel="stylesheet" href="{{ '/assets/css/noscript.css' | relative_url }}"></noscript>
<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">

<script>
  (function () {
    try {
      var saved = localStorage.getItem('aw-theme');
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) {
        document.getElementById('theme-light-css').disabled = true;
        document.getElementById('theme-dark-css').disabled = false;
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  })();
</script>
