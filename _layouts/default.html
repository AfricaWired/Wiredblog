<!DOCTYPE html>
<html lang="en">
<head>
{% include head.html %}
</head>
<body class="is-preload">

<div id="wrapper" class="fade-in">

  {% if page.hero %}{% include intro.html %}{% endif %}

  {% include nav.html %}

  <div id="main">
    {{ content }}
  </div>

  {% include footer.html %}

</div>

<script src="{{ '/assets/js/jquery.min.js' | relative_url }}"></script>
<script src="{{ '/assets/js/jquery.scrollex.min.js' | relative_url }}"></script>
<script src="{{ '/assets/js/jquery.scrolly.min.js' | relative_url }}"></script>
<script src="{{ '/assets/js/browser.min.js' | relative_url }}"></script>
<script src="{{ '/assets/js/breakpoints.min.js' | relative_url }}"></script>
<script src="{{ '/assets/js/util.js' | relative_url }}"></script>
<script src="{{ '/assets/js/main.js' | relative_url }}"></script>
<script>
  (function () {
    'use strict';

    var lightCss = document.getElementById('theme-light-css');
    var darkCss = document.getElementById('theme-dark-css');
    var toggle = document.getElementById('theme-toggle');

    function isDark() {
      return !darkCss.disabled;
    }

    function setTheme(dark) {
      lightCss.disabled = dark;
      darkCss.disabled = !dark;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      if (toggle) {
        toggle.classList.toggle('fa-moon', !dark);
        toggle.classList.toggle('fa-sun', dark);
      }
    }

    setTheme(isDark());

    if (toggle) {
      toggle.addEventListener('click', function (event) {
        event.preventDefault();
        var dark = !isDark();
        setTheme(dark);
        try { localStorage.setItem('aw-theme', dark ? 'dark' : 'light'); } catch (e) {}
      });
    }
  })();
</script>
</body>
</html>
